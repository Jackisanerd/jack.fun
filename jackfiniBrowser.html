  .tagline { font-size: 15px; color: #888; margin-bottom: 24px; }

  .elem:active { transform: scale(.97); }
  .elem .ic { font-size: 16px; line-height: 1; }
  .count { color:#666; font-size:13px; margin-top:12px; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-bg.open { display: flex; }
  .modal { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto; padding: 28px; position: relative; }
  .modal-close { position: absolute; top: 16px; right: 16px; background: #252525; border: 1px solid #333; border-radius: 6px; color: #aaa; cursor: pointer; padding: 5px 12px; font-size: 13px; }
  .modal-close:hover { color: #fff; border-color: #555; }
  .modal-title { font-size: 22px; font-weight: 700; color: #fff; margin: 0 76px 4px 0; }
  .modal-subtitle { font-size: 13px; color: #777; margin-bottom: 24px; }
  .recipe-step { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .step-num { width: 22px; height: 22px; border-radius: 50%; background: #252525; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #888; flex-shrink: 0; }

const grid = document.getElementById('elem-grid');
function renderAll(list) {
  grid.innerHTML = '';
  list.forEach(el => {
    const d = document.createElement('button');
    d.type = 'button';
    d.className = 'elem';
    const icon = document.createElement('span');
    icon.className = 'ic';
    icon.textContent = el.e;
    const name = document.createElement('span');
    name.textContent = el.n;
    d.append(icon, name);
    d.onclick = () => openModal(el);
    grid.appendChild(d);
  });
  document.getElementById('result-count').textContent = `${list.length} element${list.length === 1 ? '' : 's'} shown`;
}
function filterElems(q) {
  const t = q.trim().toLowerCase();
  renderAll(t ? elements.filter(e => e.n.toLowerCase().includes(t) || e.e.toLowerCase().includes(t)) : elements);
}
function openModal(el) {
  document.getElementById('modal-title').textContent = `${el.e} ${el.n}`;
  document.getElementById('modal-subtitle').textContent = `${el.steps.length} crafting step${el.steps.length === 1 ? '' : 's'}`;
  const stepsEl = document.getElementById('modal-steps');
  stepsEl.innerHTML = '';
  el.steps.forEach((step, i) => {
    const row = document.createElement('div');
    row.className = 'recipe-step';
    const num = document.createElement('div');
    num.className = 'step-num';
    num.textContent = i + 1;
    const body = document.createElement('div');
    body.className = 'step-body';
    [[step[0], 'step-a'], ['+', 'step-plus'], [step[1], 'step-a'], ['=', 'step-eq'], [step[2], 'step-result']].forEach(([text, cls]) => {
      const span = document.createElement('span');
      span.className = cls;
      span.textContent = text;
      body.appendChild(span);
    });
    row.append(num, body);
    stepsEl.appendChild(row);
  });
  const last = el.steps[el.steps.length - 1][2];
  const final = document.getElementById('modal-final');
  final.innerHTML = '';
  const tag = document.createElement('div');
  tag.className = 'final-tag';
  tag.textContent = `✓ Final result: ${last}`;
  final.appendChild(tag);
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }
function bgClose(e) { if (e.target === document.getElementById('modal-bg')) closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('element-count').textContent = elements.length;
renderAll(elements);
